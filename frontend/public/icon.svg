<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="wm-emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1EAA84" />
      <stop offset="100%" stop-color="#148365" />
    </linearGradient>
    <filter id="wm-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#148365" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- WanderMap Leaf/Compass Signature Shape (50% 50% 50% 6px) -->
  <path
    d="M32 4
       C47.464 4 60 16.536 60 32
       C60 47.464 47.464 60 32 60
       C17.5 60 6 60 5 49
       C4 38 4 32 4 32
       C4 16.536 16.536 4 32 4 Z"
    fill="url(#wm-emerald-grad)"
    filter="url(#wm-glow)"
  />

  <!-- Inner Compass Ring -->
  <circle
    cx="32"
    cy="32"
    r="16"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.95"
  />

  <!-- Compass Needle (North-South pointer) -->
  <polygon
    points="38.7 25.3 35.3 35.3 25.3 38.7 28.7 28.7"
    fill="#FFFFFF"
  />

  <!-- Center Pin Core -->
  <circle cx="32" cy="32" r="2.5" fill="#148365" />
</svg>
